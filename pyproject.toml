[project]
name = "diablos-stuff-plus"
version = "0.1.0"
description = "Stuff+ calibrado a las condiciones fisicas de la LMB (Harp Helu, 2240 m)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "shap>=0.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stuffplus"]
